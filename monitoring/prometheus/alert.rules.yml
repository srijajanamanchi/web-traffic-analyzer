groups:
  - name: traffic_analyzer_alerts
    rules:
      - alert: ServiceDown
        expr: up{job="traffic-backend"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Traffic Analyzer backend service down"
          description: "Backend container is unreachable or healthcheck failing for > 30s."

      - alert: HighErrorRate
        expr: (sum(rate(traffic_analyzer_requests_total{status=~"4..|5.."}[2m])) / sum(rate(traffic_analyzer_requests_total[2m]))) * 100 > 15
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "High HTTP error rate detected (>15%)"
          description: "Elevated volume of 4xx and 5xx responses detected in telemetry stream."

      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(traffic_analyzer_request_duration_seconds_bucket[2m])) by (le)) > 0.5
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "High P95 latency (>500ms)"
          description: "P95 request response time is exceeding 500ms."

      - alert: AnomalyDetected
        expr: increase(traffic_analyzer_anomalies_detected_total[1m]) > 0
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "Statistical anomaly detected"
          description: "Traffic surge, error spike, or malicious IP scanner flagged by z-score engine."
